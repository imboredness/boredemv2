[include]
files = [
]

[include.optional]
files = ["noctalia.toml"]

[general]
autostart = ["noctalia"]
mod_key = "Super"
show_cheatsheet = false
xwayland = true
focus_on_activate = false
attach_modal_dialogs = true
honor_restored_maximize = false

[effects]

[environment]
XCURSOR_SIZE = "24"
QT_QPA_PLATFORMTHEME = "qt6ct"

[output.eDP-1]
mode = "1920x1080@60"
scale = 1.0
focus_at_startup = true
workspaces = 4

[appearance]
corner_radius = 0
border_width = 2
outer_border_width = 0
prefer_no_csd = true
drag_opacity = 0.8
opaque_fullscreen = true

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 8
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1696

[appearance.shadow]
enabled = true
softness = 8
offset_x = 0
offset_y = 0

[colors]
shadow = "#1A1A1AEE"

[input.keyboard]
layout = "us,ara"
options = "grp:alt_shift_toggle"
repeat_rate = 35
repeat_delay = 350
numlock_toggle = false

[input.mouse]
sensitivity = 0.0
accel_profile = "flat"

[input.touchpad]
natural_scroll = false
sensitivity = 0.0
accel_profile = "flat"

[input.focus]
follows_mouse = true
hover_raises = true

[input.cursor]
size = 24

[layout]
mode = "dwindle"
gap = 4
extent_presets = [0.333, 0.5, 0.667]

[layout.dwindle]
preserve_split = true

[layout.master]
new_becomes_master = true

[layout.scrolling]
default_extent_fraction = 0.5

[animation]
enabled = true
duration_ms = 250
curve = "standard"

[animation.beziers]
specialWorkSwitch = [0.05, 0.7, 0.1, 1.0]
emphasizedAccel = [0.3, 0.0, 0.8, 0.15]
emphasizedDecel = [0.05, 0.7, 0.1, 1.0]
standard = [0.2, 0.0, 0.0, 1.0]

[animation.windows_in]
enabled = true
duration_ms = 250
curve = "emphasizedDecel"
style = "popin"
scale = 0.8

[animation.windows_out]
enabled = true
duration_ms = 200
curve = "emphasizedAccel"
style = "popin"
scale = 0.8

[animation.windows_move]
enabled = true
duration_ms = 250
curve = "standard"

[animation.windows_resize]
enabled = true
duration_ms = 250
curve = "standard"

[animation.windows_opacity]
enabled = true
duration_ms = 250
curve = "standard"

[animation.workspaces]
enabled = true
duration_ms = 300
curve = "standard"
style = "slide"

[animation.scratchpad]
enabled = true
duration_ms = 200
curve = "specialWorkSwitch"
dim = 0.2
blur = true

[animation.border]
enabled = true
duration_ms = 250
curve = "standard"

[animation.layers]
enabled = true
duration_ms = 200
curve = "emphasizedDecel"

[animation.overview]
enabled = true
curve = "spring:1,800"
workspace_curve = "spring:1,1000"

[animation.dim_unfocused]
enabled = true
dim = 0.125
duration_ms = 250
curve = "standard"

[overview]
zoom = 0.5
background_blur = true
workspace_wallpaper = true
shortcuts = true
shortcut_keys = "1234567890"

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"

[keybinds]

"Mod+Return" = { action = "spawn kitty", repeat = false }
"Mod+Space" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+E" = { action = "spawn dolphin", repeat = false }
"Mod+B" = { action = "spawn librewolf", repeat = false }
"Mod+D" = { action = "spawn kitty -e concord", repeat = false }
"Mod+S" = { action = "spawn flatpak run org.vinegarhq.Sober", repeat = false }

"Mod+Z" = { action = "spawn noctalia msg settings-toggle", repeat = false }
"Mod+X" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }
"Mod+L" = { action = "spawn noctalia msg session lock", repeat = false }
"Mod+Alt+C" = { action = "spawn noctalia msg panel-toggle session", repeat = false }
"Mod+Shift+W" = { action = "spawn noctalia msg panel-toggle wallpaper", repeat = false }
"Mod+V" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false }
"Mod+Shift+S" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Mod+P" = { action = "spawn noctalia msg plugin oldirtty/color_picker:service all pick", repeat = false }

"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Shift+Q" = { action = "window-kill", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-floating", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+T" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Shift+T" = { action = "window-toggle-pinned", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+F1" = "window-focus-next"

"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Down" = "window-move-down"

"Mod+Alt+T" = "layout-toggle-split"
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Minus" = "window-modify-primary-extent -0.02"
"Mod+Equal" = "window-modify-primary-extent +0.02"
"Mod+Ctrl+Minus" = "window-modify-secondary-extent -0.02"
"Mod+Ctrl+Equal" = "window-modify-secondary-extent +0.02"
"Mod+Comma" = "window-consume-left"
"Mod+Period" = "window-consume-right"
"Mod+Ctrl+Comma" = "window-consume-from-left"
"Mod+Ctrl+Period" = "window-consume-from-right"
"Mod+Alt+Right" = "column-focus-tab-next"
"Mod+Alt+Left" = "column-focus-tab-previous"

"Mod+O" = { action = "overview-toggle", repeat = false }

"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"

"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"

"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }

"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+Ctrl+Space" = { action = "scratchpad-toggle", repeat = false }
"Mod+Tab" = { action = "scratchpad-focus-next", repeat = false }

"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioMicMute" = { action = "spawn noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioPause" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true, repeat = false }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true, repeat = false }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }

[[window_rule]]
blur = true
opacity = 0.8

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

[[window_rule]]
match.app_id = "^sonora$"
opacity = 0.8

[[layer_rule]]
match.namespace = '^noctalia-(bar-[^"]+|notification|dock|panel|attached-panel|osd|window-switcher|desktop-widget-[^"]*)$'
blur = true
blur_ignore_alpha = 0.1
blur_popups = true

[[layer_rule]]
match.namespace = '^noctalia-(notification|dock|panel|attached-panel|osd|window-switcher)$'
blur_optimized = false
